---
## 1. PREPARATION DE L'INFRASTRUCTURE
- name: Ensure vault namespace exists
  kubernetes.core.k8s:
    name: vault
    api_version: v1
    kind: Namespace
    state: present

- name: Force release of Vault PV
  ansible.builtin.shell: |
    STATUS=$(kubectl get pv vault-pv-static -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
    if [ "$STATUS" = "Released" ]; then
      kubectl patch pv vault-pv-static -p '{"spec":{"claimRef":null}}'
    fi
  changed_when: false

- name: "Create Static PV for Vault (Dataset: vault)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata: { name: vault-pv-static }
      spec:
        capacity: { storage: 10Gi }
        accessModes: [ReadWriteOnce]
        persistentVolumeReclaimPolicy: Retain
        storageClassName: truenas-nfs
        nfs: { server: "{{ nfs_server_ip }}", path: "{{ nfs_base_path }}/vault" }

## 2. DÉPLOIEMENT DE L'APPLICATION
- name: Install Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    chart_version: 0.32.0
    values:
      server:
        ha: { enabled: false }
        replicas: 1
        dataStorage: 
          enabled: true
          size: 10Gi
          storageClass: truenas-nfs
          mountPath: "/vault/data"
        standalone:
          enabled: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "raft" {
              path = "/vault/data"
            }
      ui: 
        enabled: true
        serviceType: LoadBalancer

- name: Wait for Vault Pod to be Running
  kubernetes.core.k8s_info:
    kind: Pod
    name: vault-0
    namespace: vault
  register: vault_pod
  until: 
    - vault_pod.resources is defined 
    - vault_pod.resources | length > 0 
    - vault_pod.resources[0].status.phase == "Running"
  retries: 30
  delay: 10