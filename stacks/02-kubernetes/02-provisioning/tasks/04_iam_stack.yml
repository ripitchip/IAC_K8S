---
# --- GESTION DU STOCKAGE STATIQUE ---
- name: Create Static PV and PVC for IAM
  kubernetes.core.k8s:
    state: present
    definition:
      # --- OPENLDAP STORAGE ---
      - apiVersion: v1
        kind: PersistentVolume
        metadata: { name: openldap-pv-static }
        spec:
          capacity: { storage: 5Gi }
          accessModes: [ReadWriteOnce]
          persistentVolumeReclaimPolicy: Retain
          storageClassName: truenas-nfs
          mountOptions: ["nfsvers=4.1", "hard"]
          nfs: { server: "{{ nfs_server_ip }}", path: "{{ nfs_base_path }}/openldap" }
          claimRef:
            name: openldap-pvc-static
            namespace: auth
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata: { name: openldap-pvc-static, namespace: auth }
        spec:
          storageClassName: truenas-nfs
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 5Gi } }
          volumeName: openldap-pv-static

      # --- KEYCLOAK POSTGRES STORAGE ---
      - apiVersion: v1
        kind: PersistentVolume
        metadata: { name: keycloak-db-pv-static }
        spec:
          capacity: { storage: 10Gi }
          accessModes: [ReadWriteOnce]
          persistentVolumeReclaimPolicy: Retain
          storageClassName: truenas-nfs
          mountOptions: ["nfsvers=4.1", "hard"]
          nfs: { server: "{{ nfs_server_ip }}", path: "{{ nfs_base_path }}/keycloak-db" }
          claimRef:
            name: keycloak-db-pvc-static
            namespace: auth
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata: { name: keycloak-db-pvc-static, namespace: auth }
        spec:
          storageClassName: truenas-nfs
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 10Gi } }
          volumeName: keycloak-db-pv-static

      # --- KEYCLOAK THEMES STORAGE ---
      - apiVersion: v1
        kind: PersistentVolume
        metadata: { name: keycloak-providers-pv-static }
        spec:
          capacity: { storage: 1Gi }
          accessModes: [ReadWriteOnce]
          persistentVolumeReclaimPolicy: Retain
          storageClassName: truenas-nfs
          mountOptions: ["nfsvers=4.1", "hard"]
          nfs: { server: "{{ nfs_server_ip }}", path: "{{ nfs_base_path }}/keycloak-providers" }
          claimRef:
            name: keycloak-providers-pvc-static
            namespace: auth
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata: { name: keycloak-providers-pvc-static, namespace: auth }
        spec:
          storageClassName: truenas-nfs
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
          volumeName: keycloak-providers-pv-static

# --- IDENTITY & AUTH LAYER (NAMESPACE) ---
- name: Deploy Auth Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: auth

# --- OPENLDAP STACK ---
- name: Deploy OpenLDAP Stack
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: v1
        kind: Service
        metadata:
          name: openldap
          namespace: auth
        spec:
          selector: { app: openldap }
          ports:
            - { name: ldap, port: 389, targetPort: 1389 }
            - { name: ldaps, port: 636, targetPort: 1636 }

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: openldap
          namespace: auth
        spec:
          replicas: 1
          strategy: { type: Recreate }
          selector:
            matchLabels: { app: openldap }
          template:
            metadata:
              labels: { app: openldap }
            spec:
              securityContext:
                fsGroup: 1001
              containers:
                - name: openldap
                  image: bitnamilegacy/openldap:2.6.10
                  env:
                    - { name: LDAP_ROOT, value: "dc=home,dc=local" }
                    - { name: LDAP_ADMIN_USERNAME, value: "admin" }
                    # Utilisation de la nouvelle variable ldap_admin_password
                    - { name: LDAP_ADMIN_PASSWORD, value: "{{ ldap_admin_password }}" }
                  ports:
                    - { containerPort: 1389 }
                    - { containerPort: 1636 }
                  volumeMounts:
                    - { name: ldap-data, mountPath: /bitnami/openldap }
              volumes:
                - name: ldap-data
                  persistentVolumeClaim: { claimName: openldap-pvc-static }

# --- KEYCLOAK STACK ---
- name: Deploy Keycloak Stack
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: v1
        kind: Service
        metadata: { name: postgres, namespace: auth }
        spec:
          selector: { app: postgres }
          ports: [{ protocol: TCP, port: 5432, targetPort: 5432 }]
          type: ClusterIP

      - apiVersion: apps/v1
        kind: Deployment
        metadata: { name: postgres, namespace: auth }
        spec:
          replicas: 1
          selector: { matchLabels: { app: postgres } }
          template:
            metadata: { labels: { app: postgres } }
            spec:
              securityContext: { fsGroup: 999 }
              containers:
                - name: postgres
                  image: mirror.gcr.io/postgres:17
                  env:
                    - { name: POSTGRES_USER, value: "keycloak" }
                    - { name: POSTGRES_PASSWORD, value: "keycloak" }
                    - { name: POSTGRES_DB, value: "keycloak" }
                  ports: [{ name: postgres, containerPort: 5432 }]
                  volumeMounts: [{ name: postgres-data, mountPath: /var/lib/postgresql/data }]
              volumes:
                - name: postgres-data
                  persistentVolumeClaim: { claimName: keycloak-db-pvc-static }

      - apiVersion: v1
        kind: Service
        metadata: { name: keycloak, namespace: auth }
        spec:
          selector: { app: keycloak }
          ports: [{ name: http, port: 8080, targetPort: 8080 }]
          type: ClusterIP

      - apiVersion: apps/v1
        kind: StatefulSet
        metadata: { name: keycloak, namespace: auth }
        spec:
          serviceName: keycloak
          replicas: 1
          selector: { matchLabels: { app: keycloak } }
          template:
            metadata: { labels: { app: keycloak } }
            spec:
              initContainers:
                - name: wait-for-postgres
                  image: busybox:1.36
                  command: ['sh', '-c', 'until nc -vz postgres.auth.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']
              containers:
                - name: keycloak
                  image: quay.io/keycloak/keycloak:26.6.1
                  args: ["start", "--http-enabled=true"]
                  ports: [{ name: http, containerPort: 8080 }]
                  env:
                    - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: "admin" }
                    - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: "{{ keycloak_admin_password }}" }
                    - { name: KC_HTTP_ENABLED, value: "true" }
                    - { name: KC_PROXY_HEADERS, value: "xforwarded" }
                    - { name: KC_HOSTNAME, value: "{{ keycloak_domain }}" }
                    - { name: KC_HOSTNAME_STRICT, value: "false" }
                    - { name: KC_HEALTH_ENABLED, value: "true" }
                    - { name: KC_CACHE, value: "local" }
                    - { name: KC_DB, value: "postgres" }
                    - { name: KC_DB_URL_HOST, value: "postgres" }
                    - { name: KC_DB_URL_DATABASE, value: "keycloak" }
                    - { name: KC_DB_USERNAME, value: "keycloak" }
                    - { name: KC_DB_PASSWORD, value: "keycloak" }
                  resources:
                    requests: { cpu: 300m, memory: 1024Mi }
                    limits: { cpu: 1000m, memory: 1500Mi }
                  volumeMounts:
                    - name: keycloak-providers-volume
                      mountPath: /opt/keycloak/providers
              volumes:
                - name: postgres-data
                  persistentVolumeClaim: { claimName: keycloak-db-pvc-static }
                - name: keycloak-providers-volume
                  persistentVolumeClaim:
                    claimName: keycloak-providers-pvc-static

# --- EXPOSITION ---
- name: Expose Keycloak via Traefik
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: keycloak-ingress
        namespace: auth
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          cert-manager.io/cluster-issuer: "letsencrypt-prod" 
      spec:
        ingressClassName: traefik
        tls: [{ hosts: ["{{ keycloak_domain }}"], secretName: keycloak-cert-tls }]
        rules:
          - host: "{{ keycloak_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service: { name: keycloak, port: { number: 8080 } }