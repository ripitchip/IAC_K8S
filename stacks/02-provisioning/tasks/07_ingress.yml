---
# 1. INSTALLATION DE TRAEFIK (Le contrôleur Ingress)
- name: Install Traefik
  kubernetes.core.helm:
    name: traefik
    chart_ref: oci://ghcr.io/traefik/helm/traefik
    release_namespace: traefik
    create_namespace: true
    # wait: true est crucial pour s'assurer que le service LoadBalancer reçoit son IP
    wait: true
    values:
      service:
        type: LoadBalancer
      deployment:
        podSecurityContext: { fsGroup: 65532 }
      ingressClass:
        enabled: true
        isDefaultClass: true
      # On définit les ports de base. La redirection sera gérée par les Ingress individuels
      # pour éviter les erreurs de schéma 'additional properties not allowed'.
      ports:
        web:
          exposedPort: 80
        websecure:
          exposedPort: 443

# 2. INSTALLATION DE CERT-MANAGER (Gestion des certificats TLS)
- name: Install Cert-Manager (OCI)
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: oci://quay.io/jetstack/charts/cert-manager
    chart_version: v1.16.2
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    values:
      installCRDs: true

- name: Wait for Cert-Manager Webhook to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: cert-manager-webhook
    namespace: cert-manager
  register: cm_webhook
  until:
    - cm_webhook.resources is defined
    - cm_webhook.resources | length > 0
    - (cm_webhook.resources[0].status.readyReplicas | default(0)) > 0
  retries: 20
  delay: 10

# 3. CONFIGURATION DES CLUSTER-ISSUERS (Émetteurs Let's Encrypt)
- name: Configure Let's Encrypt Issuers
  kubernetes.core.k8s:
    state: present
    definition:
      # --- ISSUER DE STAGING (Pour éviter les rate limits en phase de test) ---
      - apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-staging
        spec:
          acme:
            email: "admin@{{ root_domain }}"
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            privateKeySecretRef:
              name: letsencrypt-staging-account-key
            solvers:
              - http01:
                  ingress:
                    class: traefik

      # --- ISSUER DE PRODUCTION (Pour les certificats reconnus officiellement) ---
- name: Configure Let's Encrypt Issuers
  kubernetes.core.k8s:
    state: present
    definition:
      # --- ISSUER DE STAGING (Pour éviter les rate limits en phase de test) ---
      - apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-staging
        spec:
          acme:
            email: "admin@{{ root_domain }}"
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            privateKeySecretRef:
              name: letsencrypt-staging-account-key
            solvers:
              - http01:
                  ingress:
                    class: traefik

      # --- ISSUER DE PRODUCTION (Pour les certificats reconnus officiellement) ---
      - apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-prod
        spec:
          acme:
            email: "admin@{{ root_domain }}"
            server: https://acme-v02.api.letsencrypt.org/directory
            privateKeySecretRef:
              name: letsencrypt-prod-account-key
            solvers:
              - http01:
                  ingress:
                    class: traefik
