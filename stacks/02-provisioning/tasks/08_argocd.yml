- name: Ensure ArgoCD namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: argocd
    state: present

- name: Check ArgoCD Helm release
  ansible.builtin.command:
    cmd: helm status argocd -n argocd
  register: argocd_helm_release
  failed_when: false
  changed_when: false

- name: Remove legacy ArgoCD namespace resources before Helm install
  ansible.builtin.command:
    cmd: >-
      kubectl -n argocd delete
      all,serviceaccount,role,rolebinding,configmap,secret
      -l app.kubernetes.io/part-of=argocd
      --ignore-not-found
  when: argocd_helm_release.rc != 0
  changed_when: true

- name: Remove legacy ArgoCD cluster resources before Helm install
  ansible.builtin.command:
    cmd: >-
      kubectl delete clusterrole,clusterrolebinding
      -l app.kubernetes.io/part-of=argocd
      --ignore-not-found
  when: argocd_helm_release.rc != 0
  changed_when: true

- name: Wait for legacy ArgoCD pods to terminate
  ansible.builtin.command:
    cmd: kubectl -n argocd wait pod -l app.kubernetes.io/part-of=argocd --for=delete --timeout=180s
  register: argocd_legacy_pods_deleted
  failed_when: false
  changed_when: false
  when: argocd_helm_release.rc != 0

- name: List legacy ArgoCD CRDs
  ansible.builtin.command:
    cmd: kubectl get crd -o name
  register: argocd_crds
  changed_when: false
  when: argocd_helm_release.rc != 0

- name: Adopt legacy ArgoCD CRDs into Helm release labels
  ansible.builtin.command:
    cmd: "kubectl label {{ item }} app.kubernetes.io/managed-by=Helm --overwrite"
  loop: "{{ argocd_crds.stdout_lines | select('search', 'argoproj\\.io') | list }}"
  when: argocd_helm_release.rc != 0
  changed_when: true

- name: Adopt legacy ArgoCD CRDs into Helm release annotations
  ansible.builtin.command:
    cmd: >-
      kubectl annotate {{ item }}
      meta.helm.sh/release-name=argocd
      meta.helm.sh/release-namespace=argocd
      --overwrite
  loop: "{{ argocd_crds.stdout_lines | select('search', 'argoproj\\.io') | list }}"
  when: argocd_helm_release.rc != 0
  changed_when: true

- name: Create ArgoCD Secret from Vault
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
        namespace: argocd
        labels:
          app.kubernetes.io/managed-by: "Helm"
        annotations:
          meta.helm.sh/release-name: "argocd"
          meta.helm.sh/release-namespace: "argocd"
      type: Opaque
      stringData:
        server.secretkey: "{{ argocd_server_secret_key }}"

- name: Install ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_ref: argo-cd
    release_namespace: argocd
    create_namespace: true
    values:
      "{{ argocd_values | combine(argocd_security_overrides, recursive=True) }}"
  vars:
    argocd_values: "{{ lookup('ansible.builtin.template', playbook_dir + '/manifests/argocd-values.yaml') | from_yaml }}"
    argocd_security_overrides:
      global:
        securityContext:
          runAsUser: 7746
          runAsGroup: 7746
          fsGroup: 7746
      redis:
        securityContext:
          runAsUser: 7746
          runAsGroup: 7746
          fsGroup: 7746
      dex:
        containerSecurityContext:
          runAsUser: 7746
          runAsGroup: 7746

- name: Apply ArgoCD Ingress
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', playbook_dir + '/manifests/argocd-ingress.yaml') | from_yaml }}"
