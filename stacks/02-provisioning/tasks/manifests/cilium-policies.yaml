# --- ARGO CD SERVER POLICY ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server-hardened
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: traefik}
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: argocd}
  egress:
    - toEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: argocd}}]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s:k8s-app": kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]

---
# --- REPO SERVER POLICY (Secure Git Access) ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server-hardened
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  ingress:
    - fromEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: argocd}
      toPorts:
        - ports: [{port: "8081", protocol: TCP}]
  egress:
    - toEndpoints: [{matchLabels: {io.kubernetes.pod.namespace: argocd}}]
    - toFQDNs:
        - matchName: "github.com"
        - matchPattern: "*.github.com"
        - matchName: "gitlab.com"
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s:k8s-app": kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]

---
# --- APPLICATION CONTROLLER POLICY ---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: argocd-controller-hardened
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: argocd}
    - toEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s:k8s-app": kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
