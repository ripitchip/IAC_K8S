---
- name: Ensure Debian non-free repositories are enabled
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^Components:\s+main\s*$'
    replace: 'Components: main contrib non-free non-free-firmware'
  register: debian_nonfree_sources

- name: Add nouveau blacklist for NVIDIA driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      blacklist nouveau
      options nouveau modeset=0
  register: nouveau_blacklist

- name: Install NVIDIA driver packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dkms
      - gnupg2
      - linux-headers-amd64
      - nvidia-driver
      - nvidia-smi
    state: present
    update_cache: true
  register: nvidia_driver_packages

- name: Rebuild initramfs after nouveau blacklist or driver install
  ansible.builtin.command:
    cmd: update-initramfs -u
  when: nouveau_blacklist.changed or nvidia_driver_packages.changed
  changed_when: true

- name: Reboot GPU worker after NVIDIA kernel changes
  ansible.builtin.reboot:
    msg: "Rebooting after NVIDIA driver configuration"
    reboot_timeout: 600
  when: nouveau_blacklist.changed or nvidia_driver_packages.changed

- name: Refresh kernel module dependencies
  ansible.builtin.command:
    cmd: depmod -a
  changed_when: false

- name: Load NVIDIA kernel module
  ansible.builtin.shell:
    cmd: modprobe nvidia || modprobe nvidia-current
  changed_when: false

- name: Validate NVIDIA driver access
  ansible.builtin.command:
    cmd: nvidia-smi
  changed_when: false

- name: Add NVIDIA Container Toolkit GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey |
        gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    executable: /bin/bash
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list |
        sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' >
        /etc/apt/sources.list.d/nvidia-container-toolkit.list
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  register: nvidia_container_toolkit

- name: Check if NVIDIA is the default containerd runtime
  ansible.builtin.command:
    cmd: grep -R 'default_runtime_name = "nvidia"' /etc/containerd
  register: nvidia_default_runtime
  failed_when: false
  changed_when: false

- name: Configure NVIDIA as the default runtime for containerd
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=containerd --set-as-default
  when: nvidia_default_runtime.rc != 0
  register: nvidia_containerd_runtime

- name: Restart containerd after NVIDIA runtime configuration
  ansible.builtin.systemd:
    name: containerd
    state: restarted
  when: nvidia_container_toolkit.changed or nvidia_containerd_runtime.changed | default(false)

- name: Restart kubelet after NVIDIA runtime configuration
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  when: nvidia_container_toolkit.changed or nvidia_containerd_runtime.changed | default(false)
